name: Publish Plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Elevate wrapper permissions
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          dependency-graph: generate-and-submit

      - name: Build Plugin
        run: ./gradlew build

      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v6
        with:
          name: plugin
          path: build/libs/*.jar

      - name: Generate Changelog
        id: changelog
        run: |
          TAG="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "$TAG" | head -1)
          echo "body=$(git log --oneline ${PREV_TAG:-HEAD~50}..HEAD --grep='fix:' --grep='feat:' --grep='chore:' --grep='docs:' -E | grep -v 'release:' | sed 's/^/ - /' | tr '\n' ' ' | sed 's/  /\\n/g')" >> $GITHUB_OUTPUT

      - name: Publish Plugin Github Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          artifacts: build/libs/*.jar
          body: ${{ steps.changelog.outputs.body }}
          generateReleaseNotes: false